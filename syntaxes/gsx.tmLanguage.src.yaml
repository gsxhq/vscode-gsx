# Coarse TextMate grammar for gsx. AUTHORED here; gsx.tmLanguage.json is generated
# (npm run gen:grammar). Philosophy: color structure, delegate embedded Go/JS/CSS,
# lean on the gsx LSP for semantic accuracy. Keep coarse — do NOT reimplement
# tree-sitter-gsx. Component bodies are matched against canonical (gsx fmt) layout:
# the opening `{` ends the signature line, the closing `}` sits alone on a line.
scopeName: source.gsx
name: gsx
patterns:
  - include: '#comments'
  - include: '#component'
  # Top-level f`…`/js`…`/css`…` values (var greeting = f`hi @{name}`,
  # var snippet = js`emit(@{id})`) — all three interpolating literals are valid
  # Go-expression values, not just attribute values; @{ } holes highlight.
  - include: '#embedded-f-literal'
  - include: '#embedded-js-literal'
  - include: '#embedded-css-literal'
  # Element/fragment/component literals as values in top-level Go and func bodies
  # (var icon = <Icon/>, return <div/>, struct fields) — the element-literals
  # feature. Inside component bodies these come from #markup instead.
  - include: '#fragment'
  - include: '#component-tag'
  - include: '#element-tag'
  - include: source.go
# Go holes (@{ … }) must win over the embedded JS/CSS grammars even when nested.
# Inside a js`…`/css`…` literal (or <script>/<style> body) the hole rule is only
# listed at the literal's top level, so as soon as source.js/source.css opens its
# own begin/end context — a JS object `{…}`, an arrow body, a CSS block — the hole
# rule falls out of scope. The JS grammar then eats `@{` as a decorator and, worse,
# reads the literal's closing backtick as the start of a JS template string, so the
# rest of the file is swallowed as JavaScript. An L:-priority injection re-applies
# the hole rule at ANY depth within those embedded scopes, consuming `@{ … }` before
# the host grammar can see the `@`.
injections:
  'L:meta.embedded.block.js.gsx, L:meta.embedded.block.css.gsx':
    patterns:
      - include: '#embedded-go-hole'
  # Element/fragment/component literals are Go VALUES that may appear anywhere Go
  # code does — including inside a func body's `{ … }`, which the embedded Go
  # grammar owns as its own block context (so the root #component-tag/#element-tag
  # rules never get a turn there and `<Icon/>` reads as a `<` comparison). This
  # L:-priority injection re-applies the tag rules at any depth within gsx source,
  # excluding strings/comments and the js/css/script/style embedded regions where a
  # '<' is not gsx markup. gofmt-spaced `a < b` does not match (the tag rules need
  # '<' glued to a tag-name char).
  'L:source.gsx -string -comment -meta.embedded.block.js.gsx -meta.embedded.block.css.gsx':
    patterns:
      - include: '#fragment'
      - include: '#component-tag'
      - include: '#element-tag'
repository:
  comments:
    patterns:
      - name: comment.line.double-slash.gsx
        match: '//.*$'
      - name: comment.block.gsx
        begin: '/\*'
        end: '\*/'
      - name: comment.block.html.gsx
        begin: '<!--'
        end: '-->'
  # Child-content position (#markup), NOT #attribute: a bare `//` is only a
  # comment there when it is the first non-whitespace on its line (matching
  # the real parser's atBareContentComment) — anywhere else on the line it is
  # literal text that renders. `^[ \t]*//.*$` uses oniguruma's per-line `^`
  # anchor (vscode-textmate scans one source line at a time) so this simply
  # cannot match a `//` preceded by real content earlier on the same line —
  # no approximation needed for that half of the rule, unlike tree-sitter-gsx
  # which has no lookbehind and must fold whitespace into the token instead.
  # Bare `/* */` is NOT included here: unlike inside a tag, the real grammar
  # never treats a bare block comment as a comment in child content (only the
  # braced `{/* … */}` form, which already delegates to #interp + source.go).
  #
  # Known approximation: like tree-sitter-gsx, this grammar has no notion of
  # "inside a <pre>/<textarea> subtree" (verbatim text there in the real
  # parser) — a line-start `//` inside one is still colored as a comment.
  content-comments:
    patterns:
      - name: comment.line.double-slash.gsx
        match: '^[ \t]*//.*$'
      - name: comment.block.html.gsx
        begin: '<!--'
        end: '-->'
  component:
    name: meta.component.gsx
    begin: '^(component)\s+(?:\(([^)]*)\)\s+)?([A-Za-z_][A-Za-z0-9_]*)(\[[^\]]*\])?\s*\(([^{]*)\)\s*(\{)\s*$'
    beginCaptures:
      '1': { name: keyword.control.component.gsx }
      '2': { name: meta.embedded.line.go.gsx, patterns: [{ include: source.go }] }
      '3': { name: entity.name.function.gsx }
      '4': { name: meta.embedded.line.go.gsx, patterns: [{ include: source.go }] }
      '5': { name: meta.embedded.line.go.gsx, patterns: [{ include: source.go }] }
      '6': { name: punctuation.section.block.begin.gsx }
    end: '^(\})\s*$'
    endCaptures:
      '1': { name: punctuation.section.block.end.gsx }
    patterns:
      - include: '#markup'
  markup:
    patterns:
      - include: '#content-comments'
      - include: '#go-block'
      - include: '#script-element'
      - include: '#style-element'
      - include: '#doctype'
      - include: '#processing-instruction-marker'
      - include: '#processing-instruction-start'
      - include: '#processing-instruction-end'
      - include: '#fragment'
      - include: '#component-tag'
      - include: '#element-tag'
      - include: '#control-flow'
      - include: '#control-flow-switch'
      - include: '#interp'
  go-block:
    name: meta.embedded.block.go.gsx
    begin: '\{\{'
    beginCaptures: { '0': { name: punctuation.section.embedded.begin.gsx } }
    end: '\}\}'
    endCaptures: { '0': { name: punctuation.section.embedded.end.gsx } }
    contentName: source.go
    patterns:
      - include: '#embedded-f-literal'
      - include: '#embedded-js-literal'
      - include: '#embedded-css-literal'
      - include: '#fragment'
      - include: '#component-tag'
      - include: '#element-tag'
      - include: source.go
  interp:
    name: meta.embedded.block.go.gsx
    begin: '(@?\{)'
    beginCaptures: { '0': { name: punctuation.section.embedded.begin.gsx } }
    end: '\}'
    endCaptures: { '0': { name: punctuation.section.embedded.end.gsx } }
    contentName: source.go
    patterns:
      # f/js/css literals and <tag>/<>/component-tag as Go-expression VALUES inside
      # { } — e.g. { wrap(<div/>) }, { cond ? <a/> : <b/> }, { f`hi @{name}` }.
      - include: '#embedded-f-literal'
      - include: '#embedded-js-literal'
      - include: '#embedded-css-literal'
      - include: '#fragment'
      - include: '#component-tag'
      - include: '#element-tag'
      - include: source.go
  # Control-flow blocks in child position: { if … }, { for … }, { switch … }.
  # Unlike a plain { expr } value (see #interp), the BRANCH BODIES are gsx child
  # content — text, elements, nested interps — NOT Go. Scoping them as Go (the old
  # behavior via #interp's contentName: source.go) made a plain apostrophe/quote in
  # body prose open a Go string/rune literal that ran away across the file.
  control-flow:
    # No blanket `name`: only the condition/clause is Go (scoped by source.go
    # token-by-token). The branch bodies are plain gsx child content, so they must
    # NOT inherit an embedded-go block scope — that would colour body prose as Go.
    begin: '(\{)\s*(if|for)\b'
    beginCaptures:
      '1': { name: punctuation.section.embedded.begin.gsx }
      '2': { name: keyword.control.go }
    end: '(\})'
    endCaptures: { '1': { name: punctuation.section.embedded.end.gsx } }
    patterns:
      # Branch body { child-content }. Listed FIRST so it claims the body-opening
      # `{` before source.go can read it as a Go block; consuming the body's `}`
      # keeps this rule's `end` aligned to the true closing brace.
      - include: '#control-body'
      - name: keyword.control.go
        match: '\belse\b'
      # The condition / for-clause between the keyword and the body `{` is real Go.
      - include: source.go
  control-body:
    begin: '(\{)'
    beginCaptures: { '1': { name: punctuation.section.embedded.begin.gsx } }
    end: '(\})'
    endCaptures: { '1': { name: punctuation.section.embedded.end.gsx } }
    patterns:
      - include: '#markup'
  # Switch is separate: its case bodies are UNBRACED (they run from `case V:` /
  # `default:` to the next case/default or the closing brace).
  control-flow-switch:
    # No blanket `name` — see #control-flow. Only the switch subject and case
    # values are Go; case bodies are plain gsx child content.
    begin: '(\{)\s*(switch)\b'
    beginCaptures:
      '1': { name: punctuation.section.embedded.begin.gsx }
      '2': { name: keyword.control.go }
    end: '(\})'
    endCaptures: { '1': { name: punctuation.section.embedded.end.gsx } }
    patterns:
      - include: '#switch-body'
      # The switch subject expression between `switch` and the body `{` is real Go.
      - include: source.go
  switch-body:
    begin: '(\{)'
    beginCaptures: { '1': { name: punctuation.section.embedded.begin.gsx } }
    end: '(\})'
    endCaptures: { '1': { name: punctuation.section.embedded.end.gsx } }
    patterns:
      - include: '#switch-case'
  switch-case:
    # `case VALUE:` or `default:` — VALUE (group 2) is real Go; the body after `:`
    # is child content until the next case/default or the closing brace (a
    # lookahead end, so the delimiter is not consumed).
    #
    # Anchored to line start (both begin and the lookahead end): a `case …:` that
    # is NOT the first thing on its line is arm-body TEXT, not a label
    # (parser/markup.go `caseBodyLabelAfterWS` — "…in that case: no" inside an arm
    # stays prose). gsx fmt puts every label on its own line, and this grammar is
    # written against canonical layout (see file header), so the anchor costs
    # nothing on formatted source; an unformatted one-line
    # `{ switch k { case "a": … } }` loses label colouring until `gsx fmt` runs.
    begin: '^\s*(case|default)\b([^:]*)(:)'
    beginCaptures:
      '1': { name: keyword.control.go }
      '2': { name: meta.embedded.line.go.gsx, patterns: [{ include: source.go }] }
      '3': { name: punctuation.separator.gsx }
    end: '(?=^\s*(?:case|default)\b|\})'
    patterns:
      - include: '#markup'
  doctype:
    name: meta.tag.doctype.gsx
    match: '(?i)(<!)(DOCTYPE)([^>]*)(>)'
    captures:
      '1': { name: punctuation.definition.tag.gsx }
      '2': { name: keyword.other.doctype.gsx }
      '4': { name: punctuation.definition.tag.gsx }
  # <?marker name=VALUE> / <?start name=VALUE> ... <?end> — processing
  # instructions (client-side patching markers/regions, parser/markup.go
  # parsePI). `marker`/`start`/`end` are the only valid targets; VALUE is a
  # "literal" or {expr}, both handled by #attribute like any other tag. Like
  # #doctype, these are "markup only" — never included at top level/injections
  # (a PI is not a valid Go-expression value, unlike #fragment/#element-tag).
  # <?start> and <?end> are matched independently (mirrors how #element-tag's
  # open/close tags are two separate, unpaired matches) rather than a single
  # begin/end spanning the region body — this grammar never nests tag scopes
  # around children (see file header: coarse, not a real parser).
  processing-instruction-marker:
    name: meta.tag.processing-instruction.marker.gsx
    begin: '(<\?)(marker)\b'
    beginCaptures:
      '1': { name: punctuation.definition.tag.gsx }
      '2': { name: entity.name.tag.processing-instruction.gsx }
    end: '(>)'
    endCaptures: { '1': { name: punctuation.definition.tag.gsx } }
    patterns: [{ include: '#attribute' }]
  processing-instruction-start:
    name: meta.tag.processing-instruction.start.gsx
    begin: '(<\?)(start)\b'
    beginCaptures:
      '1': { name: punctuation.definition.tag.gsx }
      '2': { name: entity.name.tag.processing-instruction.gsx }
    end: '(>)'
    endCaptures: { '1': { name: punctuation.definition.tag.gsx } }
    patterns: [{ include: '#attribute' }]
  processing-instruction-end:
    name: meta.tag.processing-instruction.end.gsx
    match: '(<\?)(end)\b\s*(>)'
    captures:
      '1': { name: punctuation.definition.tag.gsx }
      '2': { name: entity.name.tag.processing-instruction.gsx }
      '3': { name: punctuation.definition.tag.gsx }
  fragment:
    name: meta.tag.fragment.gsx
    match: '(</?>)'
    captures: { '1': { name: punctuation.definition.tag.gsx } }
  component-tag:
    # Uppercase-initial (Card) or dotted (ui.Button, nav.Link) → component.
    name: meta.tag.component.gsx
    begin: '(</?)((?:[a-z][a-zA-Z0-9]*\.)?[A-Z][A-Za-z0-9.]*)(\[[^\]]+\])?'
    beginCaptures:
      '1': { name: punctuation.definition.tag.gsx }
      '2': { name: entity.name.type.component.gsx }
      '3': { name: meta.embedded.line.go.gsx, patterns: [{ include: source.go }] }
    end: '(/?>)'
    endCaptures: { '1': { name: punctuation.definition.tag.gsx } }
    patterns: [{ include: '#attribute' }]
  element-tag:
    # Lowercase/hyphenated → native element.
    name: meta.tag.element.gsx
    begin: '(</?)([a-z][a-z0-9-]*)'
    beginCaptures:
      '1': { name: punctuation.definition.tag.gsx }
      '2': { name: entity.name.tag.gsx }
    end: '(/?>)'
    endCaptures: { '1': { name: punctuation.definition.tag.gsx } }
    patterns: [{ include: '#attribute' }]
  attribute:
    patterns:
      # Source-only comments between attributes: bare // and /* */. Braced
      # {/* */} / {// } are handled by #interp (embedded source.go). Comments
      # first so a `//` in tag-interior position never falls through to text.
      - include: '#comments'
      - include: '#go-block'
      - include: '#embedded-js-attribute'
      - include: '#embedded-css-attribute'
      # f-prefixed interpolating attribute literal: name=f`…@{ expr }…` or name=f"…".
      # (js/css attribute literals are the two includes above.) A BARE name=`…` is a
      # plain Go raw string — handled by the backtick plain-string rule below.
      - include: '#embedded-f-attribute'
      # class={…}/style={…}: embed source.go so value-form if/switch/case/default/else
      # highlight as Go keywords. Two separate rules (no alternation) so {capture 2}
      # is always the opening brace. Must come before #interp to take priority.
      - name: meta.attribute.class-value.gsx
        begin: '(class)\s*=\s*(\{)'
        beginCaptures:
          '1': { name: entity.other.attribute-name.class.gsx }
          '2': { name: punctuation.section.embedded.begin.gsx }
        end: '\}'
        endCaptures: { '0': { name: punctuation.section.embedded.end.gsx } }
        contentName: meta.embedded.block.go.gsx
        patterns:
          - include: '#embedded-f-literal'
          - include: '#composable-arm-body'
          - include: source.go
      - name: meta.attribute.style-value.gsx
        begin: '(style)\s*=\s*(\{)'
        beginCaptures:
          '1': { name: entity.other.attribute-name.gsx }
          '2': { name: punctuation.section.embedded.begin.gsx }
        end: '\}'
        endCaptures: { '0': { name: punctuation.section.embedded.end.gsx } }
        contentName: meta.embedded.block.go.gsx
        patterns:
          - include: '#embedded-f-literal'
          - include: '#embedded-css-literal'
          - include: '#composable-arm-body'
          - include: source.go
      - include: '#interp'
      - name: string.quoted.double.gsx
        begin: '"'
        end: '"'
      # Bare name=`…` — a plain, non-interpolating Go raw string (no @{ } holes).
      - name: string.quoted.other.backtick.gsx
        begin: '`'
        end: '`'
      - name: keyword.operator.assignment.gsx
        match: '='
      # Attribute names follow the HTML authoring rule (gsx internal/htmlattr.NameRune):
      # any rune except controls (C0/C1), whitespace, `"`, `'`, `>`, `/`, `=`, minus the gsx
      # exclusions `<`, `{`, `}` and the value-literal backtick. There is NO distinct
      # first-rune class, so `.prop`,
      # `?disabled`, `#ref`, `[a]`, `(b)`, `on:click|preventDefault`, `*ngIf`, `a&b`
      # are all names. Unicode noncharacters are not excluded (irrelevant to a
      # highlighter). The same class is reused by the embedded-*-attribute rules.
      - name: entity.other.attribute-name.gsx
        match: '[^\s"''<>/={}`\p{Cc}]+'
  # A value-form's nested braces inside class={…}/style={…}: the `{ … }` of an
  # if/else arm, and a switch's body braces. Without this, source.go's block
  # rule claims that region first and its raw-string rule then colours a
  # `` f`…` ``/`` css`…` `` arm as a plain Go raw string, losing the
  # interpolation holes and the sublanguage. Listed before source.go and
  # consuming its own closing brace, the same way #control-body keeps
  # #control-flow's `end` aligned.
  composable-arm-body:
    begin: '(\{)'
    beginCaptures: { '1': { name: punctuation.section.embedded.begin.gsx } }
    end: '(\})'
    endCaptures: { '1': { name: punctuation.section.embedded.end.gsx } }
    patterns:
      - include: '#embedded-f-literal'
      - include: '#embedded-css-literal'
      - include: '#composable-arm-body'
      - include: source.go
  embedded-go-hole:
    name: meta.embedded.block.go.gsx
    begin: '@\{'
    beginCaptures: { '0': { name: punctuation.section.embedded.begin.gsx } }
    end: '\}'
    endCaptures: { '0': { name: punctuation.section.embedded.end.gsx } }
    contentName: source.go
    patterns: [{ include: source.go }]
  # ── Interpolating literals: f / js / css prefix, either delimiter (` or "). ──
  # Interpolation is OPT-IN: only a prefix immediately glued to the delimiter
  # interpolates. A BARE `…` / "…" is a plain Go string (handled by source.go in
  # value position, or the plain-string rules in #attribute) with NO @{ } holes.
  # `f`  = generic auto-escaped text (no sublanguage); `js`/`css` embed
  # source.js / source.css. @{ } holes always embed source.go. The
  # `(?<!\\)(?:\\\\)*\K\N` end backreferences the opening delimiter so `…` closes
  # on a backtick and "…" on a double-quote, each honoring its \` / \" escape.
  # The `(?<![A-Za-z0-9_.])` guard mirrors the compiler rule: the prefix must be a
  # standalone token (an identifier glued to a string is never valid Go).
  embedded-f-literal:
    name: meta.embedded.block.fstring.gsx
    begin: '(?<![A-Za-z0-9_.])(f)([`"])'
    beginCaptures:
      '1': { name: support.type.embedded-language.gsx }
      '2': { name: punctuation.definition.string.begin.gsx }
    end: '(?<!\\)(?:\\\\)*\K\2'
    endCaptures: { '0': { name: punctuation.definition.string.end.gsx } }
    contentName: string.interpolated.gsx
    patterns:
      - include: '#embedded-go-hole'
  embedded-js-literal:
    name: meta.embedded.block.js.gsx
    begin: '(?<![A-Za-z0-9_.])(js)([`"])'
    beginCaptures:
      '1': { name: support.type.embedded-language.gsx }
      '2': { name: punctuation.definition.string.begin.gsx }
    end: '(?<!\\)(?:\\\\)*\K\2'
    endCaptures: { '0': { name: punctuation.definition.string.end.gsx } }
    contentName: source.js
    patterns:
      - include: '#embedded-go-hole'
      - include: source.js
  embedded-css-literal:
    name: meta.embedded.block.css.gsx
    begin: '(?<![A-Za-z0-9_.])(css)([`"])'
    beginCaptures:
      '1': { name: support.type.embedded-language.gsx }
      '2': { name: punctuation.definition.string.begin.gsx }
    end: '(?<!\\)(?:\\\\)*\K\2'
    endCaptures: { '0': { name: punctuation.definition.string.end.gsx } }
    contentName: source.css
    patterns:
      - include: '#embedded-go-hole'
      - include: source.css
  embedded-f-attribute:
    name: meta.embedded.block.fstring.gsx
    begin: '([^\s"''<>/={}`\p{Cc}]+)(\s*=\s*)(\{?)(f)([`"])'
    beginCaptures:
      '1': { name: entity.other.attribute-name.gsx }
      '2': { name: keyword.operator.assignment.gsx }
      '3': { name: punctuation.section.embedded.begin.gsx }
      '4': { name: support.type.embedded-language.gsx }
      '5': { name: punctuation.definition.string.begin.gsx }
    end: '((?<!\\)(?:\\\\)*\K\5)(\})?'
    endCaptures:
      '1': { name: punctuation.definition.string.end.gsx }
      '2': { name: punctuation.section.embedded.end.gsx }
    contentName: string.interpolated.gsx
    patterns:
      - include: '#embedded-go-hole'
  embedded-js-attribute:
    name: meta.embedded.block.js.gsx
    begin: '([^\s"''<>/={}`\p{Cc}]+)(\s*=\s*)(\{?)(js)([`"])'
    beginCaptures:
      '1': { name: entity.other.attribute-name.gsx }
      '2': { name: keyword.operator.assignment.gsx }
      '3': { name: punctuation.section.embedded.begin.gsx }
      '4': { name: support.type.embedded-language.gsx }
      '5': { name: punctuation.definition.string.begin.gsx }
    end: '((?<!\\)(?:\\\\)*\K\5)(\})?'
    endCaptures:
      '1': { name: punctuation.definition.string.end.gsx }
      '2': { name: punctuation.section.embedded.end.gsx }
    contentName: source.js
    patterns:
      - include: '#embedded-go-hole'
      - include: source.js
  embedded-css-attribute:
    name: meta.embedded.block.css.gsx
    begin: '([^\s"''<>/={}`\p{Cc}]+)(\s*=\s*)(\{?)(css)([`"])'
    beginCaptures:
      '1': { name: entity.other.attribute-name.gsx }
      '2': { name: keyword.operator.assignment.gsx }
      '3': { name: punctuation.section.embedded.begin.gsx }
      '4': { name: support.type.embedded-language.gsx }
      '5': { name: punctuation.definition.string.begin.gsx }
    end: '((?<!\\)(?:\\\\)*\K\5)(\})?'
    endCaptures:
      '1': { name: punctuation.definition.string.end.gsx }
      '2': { name: punctuation.section.embedded.end.gsx }
    contentName: source.css
    patterns:
      - include: '#embedded-go-hole'
      - include: source.css
  script-element:
    begin: '(<)(script)\b([^>]*)(>)'
    beginCaptures:
      '1': { name: punctuation.definition.tag.gsx }
      '2': { name: entity.name.tag.gsx }
      '4': { name: punctuation.definition.tag.gsx }
    end: '(</)(script)\s*(>)'
    endCaptures:
      '1': { name: punctuation.definition.tag.gsx }
      '2': { name: entity.name.tag.gsx }
      '3': { name: punctuation.definition.tag.gsx }
    contentName: meta.embedded.block.js.gsx
    patterns: [{ include: source.js }]
  style-element:
    begin: '(<)(style)\b([^>]*)(>)'
    beginCaptures:
      '1': { name: punctuation.definition.tag.gsx }
      '2': { name: entity.name.tag.gsx }
      '4': { name: punctuation.definition.tag.gsx }
    end: '(</)(style)\s*(>)'
    endCaptures:
      '1': { name: punctuation.definition.tag.gsx }
      '2': { name: entity.name.tag.gsx }
      '3': { name: punctuation.definition.tag.gsx }
    contentName: meta.embedded.block.css.gsx
    patterns: [{ include: source.css }]
